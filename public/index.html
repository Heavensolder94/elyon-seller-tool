<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=/index.html" />
  <title>Elyon Seller Tool</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      color: #e5e7eb;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 640px;
      padding: 28px;
      border-radius: 22px;
      background: rgba(18, 24, 44, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.16);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    a {
      color: #7dd3fc;
    }
    .muted {
      color: #93a4bd;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Originales Elyon-Design wird geladen</h1>
    <p class="muted">
      Wenn dein Browser nicht automatisch weiterleitet, öffne
      <a href="/index.html">/index.html</a> direkt.
    </p>
  </div>
</body>
</html>

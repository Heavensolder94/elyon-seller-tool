<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.78);
      --border-soft: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --shadow-card: 0 18px 45px rgba(0, 0, 0, 0.32);
      --shadow-glow: 0 0 22px rgba(56, 189, 248, 0.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(56,189,248,0.16), transparent 32%),
        radial-gradient(circle at bottom right, rgba(14,165,233,0.12), transparent 35%),
        linear-gradient(135deg, #0f172a 0%, #111827 45%, #020617 100%);
    }
    .box {
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.14);
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 700;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 4.8vw, 48px);
      letter-spacing: -0.05em;
      line-height: 1.02;
    }
    p {
      margin: 0 0 14px;
      color: var(--text-muted);
      line-height: 1.7;
    }
    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="box">
    <span class="eyebrow">Policy</span>
    <h1>Privacy Policy for Elyon Seller Tool</h1>
    <p>This page is used for eBay OAuth and basic project information.</p>
    <p>All existing endpoints and login flows stay available. The page now matches the same dark SaaS visual language as the rest of the tool.</p>
    <p><a href="/">Back to tool</a></p>
  </main>
</body>
</html>

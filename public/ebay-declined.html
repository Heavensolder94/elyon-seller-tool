<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay Authorization Declined</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.78);
      --border-soft: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --shadow-card: 0 18px 45px rgba(0, 0, 0, 0.32);
      --shadow-glow: 0 0 22px rgba(56, 189, 248, 0.22);
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(56,189,248,0.16), transparent 32%),
        radial-gradient(circle at bottom right, rgba(14,165,233,0.12), transparent 35%),
        linear-gradient(135deg, #0f172a 0%, #111827 45%, #020617 100%);
    }
    .box {
      width: min(720px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.18);
      color: #fecaca;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 4.8vw, 48px);
      letter-spacing: -0.05em;
      line-height: 1.02;
    }
    p {
      margin: 0;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.14);
      color: var(--text-main);
      background: rgba(15, 23, 42, 0.54);
    }
    a.btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 0;
      box-shadow: var(--shadow-glow);
    }
    @media (max-width: 640px) {
      body { padding: 16px; }
      .box { padding: 20px; border-radius: 20px; }
      .actions { flex-direction: column; }
      a.btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="box">
    <span class="eyebrow">Authorization declined</span>
    <h1>eBay Authorization abgebrochen</h1>
    <p>Der Login wurde nicht abgeschlossen. Du kannst den Flow jederzeit neu starten oder zur Hauptseite zurueckkehren.</p>
    <div class="actions">
      <a class="btn primary" href="/ebay-token-exchange">Login erneut starten</a>
      <a class="btn" href="/">Zurueck zum Tool</a>
    </div>
  </main>
</body>
</html>

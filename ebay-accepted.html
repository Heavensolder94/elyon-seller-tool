<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay Authorization</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      margin:0;
      padding:24px;
      background:#f8fafc;
      color:#111827;
    }
    .box{
      max-width:900px;
      margin:0 auto;
      background:#fff;
      padding:24px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    .hint{color:#64748b;font-size:13px;line-height:1.5}
    .ok{color:#166534;font-weight:700}
    .warn{color:#92400e;font-weight:700}
    pre{
      background:#e2e8f0;
      padding:16px;
      border-radius:12px;
      white-space:pre-wrap;
      word-break:break-word;
      overflow:auto;
    }
    button{
      margin-top:12px;
      padding:10px 14px;
      border:0;
      border-radius:10px;
      background:#2563eb;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>eBay Authorization</h1>
    <p class="hint">Die Seite liest den eBay-Code aus der URL und tauscht ihn automatisch gegen den Refresh Token.</p>

    <div id="status" class="warn">Warte auf code in der URL ...</div>
    <pre id="output">Noch keine Daten.</pre>
    <button id="copyBtn" type="button">Ergebnis kopieren</button>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    async function exchangeCode() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (!code) {
        statusEl.textContent = 'Kein code in der URL gefunden.';
        outputEl.textContent = 'Bitte den eBay-Login nochmal ausführen.';
        return;
      }

      statusEl.textContent = 'Code gefunden. Tausche ihn jetzt gegen Token ...';
      outputEl.textContent = 'Bitte warten ...';

      try {
        const res = await fetch('/api/ebay/exchange-token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            code,
            environment: 'production'
          })
        });

        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);

        if (data.ok && data.refresh_token) {
          statusEl.innerHTML = '<span class="ok">Refresh Token erfolgreich erhalten.</span>';
        } else {
          statusEl.innerHTML = '<span class="warn">Token-Exchange hat geantwortet, aber ohne refresh_token.</span>';
        }
      } catch (err) {
        statusEl.innerHTML = '<span class="warn">Fehler beim Token-Exchange.</span>';
        outputEl.textContent = String(err.message || err);
      }
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(outputEl.textContent || '');
        copyBtn.textContent = 'Kopiert';
        setTimeout(() => copyBtn.textContent = 'Ergebnis kopieren', 1200);
      } catch {
        alert('Kopieren nicht möglich.');
      }
    });

    exchangeCode();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay Token Exchange</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f8fafc;
      color:#111827;
      padding:24px;
    }
    .box{
      max-width:900px;
      margin:0 auto;
      background:#fff;
      border-radius:16px;
      padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    label{display:block;margin:14px 0 6px;font-weight:700}
    textarea, select{
      width:100%;
      padding:12px 14px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      font-size:15px;
      box-sizing:border-box;
    }
    button{
      margin-top:16px;
      padding:12px 16px;
      border:0;
      border-radius:12px;
      background:#2563eb;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    pre{
      margin-top:16px;
      background:#e2e8f0;
      padding:16px;
      border-radius:12px;
      white-space:pre-wrap;
      word-break:break-word;
      overflow:auto;
    }
    .hint{color:#64748b;font-size:13px;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <h1>eBay Token Exchange</h1>
    <p class="hint">
      Hier fügst du den Authorization Code ein und holst dir den refresh_token vom Backend.
    </p>

    <label for="code">Authorization Code</label>
    <textarea id="code" rows="4" placeholder="code von eBay hier einfügen"></textarea>

    <label for="env">Environment</label>
    <select id="env">
      <option value="production" selected>Production</option>
      <option value="sandbox">Sandbox</option>
    </select>

    <button id="runBtn">Token holen</button>

    <label for="result">Ergebnis</label>
    <pre id="result">Noch nichts ausgeführt.</pre>
  </div>

  <script>
    const codeEl = document.getElementById('code');
    const envEl = document.getElementById('env');
    const resultEl = document.getElementById('result');

    const params = new URLSearchParams(window.location.search);
    const codeFromUrl = params.get('code');
    if (codeFromUrl) codeEl.value = codeFromUrl;

    document.getElementById('runBtn').addEventListener('click', async () => {
      const code = codeEl.value.trim();
      const env = envEl.value;

      if (!code) {
        resultEl.textContent = 'Bitte zuerst den code einfügen.';
        return;
      }

      resultEl.textContent = 'Token wird geholt...';

      try {
        const url =
          '/api/ebay/exchange-token?code=' +
          encodeURIComponent(code) +
          '&environment=' +
          encodeURIComponent(env);

        const res = await fetch(url);
        const data = await res.json();

        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = 'Fehler: ' + err.message;
      }
    });
  </script>
</body>
</html>

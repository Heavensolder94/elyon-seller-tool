name: Systemweite eBay-Kategorien

on:
  push:
    branches:
      - feat/systemwide-ebay-categories
    paths:
      - .github/workflows/systemwide-ebay-categories.yml
      - scripts/apply-systemwide-ebay-categories.mjs
      - scripts/fix-systemwide-ebay-categories-after-apply.mjs
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: feat/systemwide-ebay-categories
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Kategorie-Patches anwenden
        run: |
          node scripts/apply-systemwide-ebay-categories.mjs
          node scripts/fix-systemwide-ebay-categories-after-apply.mjs

      - name: Tests ausführen
        run: npm test

      - name: Layout prüfen
        run: npm run check:layout

      - name: Build prüfen
        run: npm run build

      - name: Performance-Budget prüfen
        run: npm run check:performance

      - name: Build-Artefakte zurücksetzen
        run: |
          git checkout -- public 2>/dev/null || true
          git clean -fd public

      - name: Nur geprüfte Kategorien-Dateien committen
        if: github.event_name == 'push'
        run: |
          git config user.name "elyon-category-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/SELLER_TOOL_MODULE_STATUS.md \
            lib/product-master.js \
            seller-auto-lister-parity-core.js \
            seller-category-engine-core.js \
            seller-company-os-inbox.js \
            seller-selling-flow-core.js \
            tests/product-master-rules.test.mjs
          if git diff --cached --quiet; then
            echo "Keine fachlichen Änderungen zu committen."
            exit 0
          fi
          git commit -m "feat: kategorien im seller tool vereinheitlichen"
          git push origin HEAD:feat/systemwide-ebay-categories

      - name: Prüfen, ob nur erwartete Dateien offen sind
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- public

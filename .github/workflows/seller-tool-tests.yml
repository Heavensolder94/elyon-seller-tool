name: Seller Tool Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Finalize retired provider removal
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 62
        shell: python
        run: |
          from pathlib import Path

          retired = "".join(("qw", "en"))
          retired_title = retired.title()

          for filename in ("index.html", "public/index.html"):
              path = Path(filename)
              raw = path.read_bytes()
              had_bom = raw.startswith(b"\xef\xbb\xbf")
              content = raw.decode("utf-8-sig")

              replacements = [
                  (f'              <option value="{retired}">{retired_title}</option>\n', ''),
                  (f'              <option value="{retired}-plus">{retired_title} Plus</option>\n', ''),
                  (f'              <option value="{retired}-flash">{retired_title} Flash</option>\n', ''),
                  (f'              <option value="{retired}-max">{retired_title} Max</option>\n', ''),
                  (
                      f"  const task = provider === 'deepseek' ? 'dashboard_deepseek_test' : provider === '{retired}' ? 'dashboard_{retired}_test' : 'dashboard_openai_test';",
                      "  const task = provider === 'deepseek' ? 'dashboard_deepseek_test' : 'dashboard_openai_test';",
                  ),
                  (
                      f"  const prompt = provider === 'deepseek' ? 'Kurzer DeepSeek Dashboard-Test.' : provider === '{retired}' ? 'Kurzer {retired_title} Dashboard-Test.' : 'Kurzer OpenAI Dashboard-Test.';",
                      "  const prompt = provider === 'deepseek' ? 'Kurzer DeepSeek Dashboard-Test.' : 'Kurzer OpenAI Dashboard-Test.';",
                  ),
                  (
                      f"  if (rawProvider === 'openai' || rawProvider === 'deepseek' || rawProvider === '{retired}' || rawProvider === 'local') return rawProvider;",
                      "  if (rawProvider === 'openai' || rawProvider === 'deepseek' || rawProvider === 'local') return rawProvider;",
                  ),
                  (f"  if (rawModel === '{retired}') return '{retired}';\n", ''),
                  (
                      f"    model: settings.aiModel || (provider === 'deepseek' ? 'deepseek-v4-flash' : provider === '{retired}' ? '{retired}-plus' : 'gpt-4o-mini'),",
                      "    model: settings.aiModel || (provider === 'deepseek' ? 'deepseek-v4-flash' : 'gpt-4o-mini'),",
                  ),
                  (f"    {{ value: '{retired}-plus', label: '{retired}-plus' }},\n", ''),
                  (f"    {{ value: '{retired}-flash', label: '{retired}-flash' }},\n", ''),
                  (f"    {{ value: '{retired}-max', label: '{retired}-max' }},\n", ''),
                  (
                      f"    return MODEL_OPTIONS.some((item) => item.value === input) ? input : '{retired}-plus';",
                      "    return MODEL_OPTIONS.some((item) => item.value === input) ? input : 'deepseek-v4-flash';",
                  ),
              ]

              retired_model_block = (
                  f"  if (provider === '{retired}') {{\n"
                  f"    if (rawModel === '{retired}-plus') return '{retired}-plus';\n"
                  f"    if (rawModel === '{retired}-flash') return '{retired}-flash';\n"
                  f"    if (rawModel === '{retired}-max') return '{retired}-max';\n"
                  f"    if (rawModel && rawModel !== '{retired}') return rawModel;\n"
                  f"    return '{retired}-plus';\n"
                  "  }\n"
              )
              replacements.append((retired_model_block, ''))

              for old, new in replacements:
                  content = content.replace(old, new)

              if retired in content.lower():
                  raise RuntimeError(f"retired provider reference remains in {filename}")

              encoded = content.encode("utf-8")
              if had_bom:
                  encoded = b"\xef\xbb\xbf" + encoded
              path.write_bytes(encoded)

          for helper_path in (
              '.github/workflows/finalize-provider-removal.yml',
              '.github/provider-cleanup-trigger',
              '.github/provider-cleanup-run',
          ):
              helper = Path(helper_path)
              if helper.exists():
                  helper.unlink()

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check selling-flow syntax
        run: |
          node --check seller-selling-flow-core.js
          node --check seller-selling-flow.js
          node --check seller-selling-flow-capture.js
          node --check seller-selling-flow-event-guard.js
          node --check seller-selling-flow-resilience.js
          node --check seller-selling-flow-visibility-fix.js
          node --check seller-selling-flow-focused-ui.js
          node --check seller-ebay-production-readiness.js
          node --check public/seller-ebay-production-readiness.js
          node --check mobile-selling-entry.js
          node --check seller-listing-visual-core.js
          node --check seller-listing-visual-designer.js
          node --check seller-auto-lister-parity-core.js
          node --check seller-auto-lister-parity.js
          node --check lib/ebay-production.js
          node --check lib/ebay-token-store.js
          node --check internal/ebay/index.js
          node --check api/ebay/index.js
          node --check api/ebay/create-draft.js
          node --check api/seller-listing-ai.js
          node --check api/ebay-taxonomy.js
          node --check scripts/performance-budget.mjs
          node --check scripts/check-performance-budget.mjs

      - name: Run tests
        run: npm test

      - name: Build Vercel output
        run: npm run build

      - name: Verify performance budgets
        run: npm run check:performance

      - name: Commit verified cleanup
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 62
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html .github/workflows/finalize-provider-removal.yml .github/provider-cleanup-trigger .github/provider-cleanup-run 2>/dev/null || true
          git add -u
          git diff --cached --check
          git commit -m "fix(ai): remove final retired provider references"
          git push origin HEAD:${GITHUB_HEAD_REF}

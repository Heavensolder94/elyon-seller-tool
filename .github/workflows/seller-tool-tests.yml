name: Seller Tool Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check selling-flow syntax
        run: |
          node --check seller-selling-flow-core.js
          node --check seller-selling-flow.js
          node --check seller-selling-flow-capture.js
          node --check seller-selling-flow-event-guard.js
          node --check seller-selling-flow-resilience.js
          node --check seller-selling-flow-visibility-fix.js
          node --check seller-selling-flow-focused-ui.js
          node --check mobile-selling-entry.js
          node --check seller-listing-visual-core.js
          node --check seller-listing-visual-designer.js
          node --check seller-auto-lister-parity-core.js
          node --check seller-auto-lister-parity.js
          node --check api/seller-listing-ai.js
          node --check api/ebay-taxonomy.js
          node --check scripts/performance-budget.mjs
          node --check scripts/check-performance-budget.mjs

      - name: Run tests
        run: npm test

      - name: Build Vercel output
        run: npm run build

      - name: Verify performance budgets
        run: npm run check:performance

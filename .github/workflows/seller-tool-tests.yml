name: Seller Tool Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check selling-flow syntax
        run: |
          node --check seller-selling-flow-core.js
          node --check seller-selling-flow.js
          node --check seller-selling-flow-capture.js
          node --check seller-selling-flow-resilience.js

      - name: Run tests
        run: npm test

      - name: Build Vercel output
        run: npm run build

name: Seller Tool Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-retired-provider:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/remove-qwen-provider' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-qwen-provider
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply provider migration
        run: node scripts/remove-qwen-provider-once.mjs apply

      - name: Run tests
        run: npm test

      - name: Build Vercel output
        run: npm run prepare:web

      - name: Verify repository cleanup
        run: node scripts/remove-qwen-provider-once.mjs finalize

      - name: Restore trusted workflow
        run: git show origin/main:.github/workflows/seller-tool-tests.yml > .github/workflows/seller-tool-tests.yml

      - name: Validate diff
        run: git diff --check

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "refactor(ai): remove retired provider completely"
          git push origin HEAD:fix/remove-qwen-provider

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check selling-flow syntax
        run: |
          node --check seller-selling-flow-core.js
          node --check seller-selling-flow.js
          node --check seller-selling-flow-capture.js
          node --check seller-selling-flow-event-guard.js
          node --check seller-selling-flow-resilience.js
          node --check seller-selling-flow-visibility-fix.js
          node --check seller-selling-flow-focused-ui.js
          node --check seller-ebay-production-readiness.js
          node --check public/seller-ebay-production-readiness.js
          node --check mobile-selling-entry.js
          node --check seller-listing-visual-core.js
          node --check seller-listing-visual-designer.js
          node --check seller-auto-lister-parity-core.js
          node --check seller-auto-lister-parity.js
          node --check lib/ebay-production.js
          node --check lib/ebay-token-store.js
          node --check internal/ebay/index.js
          node --check api/ebay/index.js
          node --check api/ebay/create-draft.js
          node --check api/seller-listing-ai.js
          node --check api/ebay-taxonomy.js
          node --check scripts/performance-budget.mjs
          node --check scripts/check-performance-budget.mjs

      - name: Run tests
        run: npm test

      - name: Build Vercel output
        run: npm run build

      - name: Verify performance budgets
        run: npm run check:performance
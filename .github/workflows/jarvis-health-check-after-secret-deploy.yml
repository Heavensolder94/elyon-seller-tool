name: Jarvis Health Check After Secret Deploy

on:
  push:
    branches:
      - ops/jarvis-product-enrichment-live-test-20260814
    paths:
      - .github/workflows/jarvis-health-check-after-secret-deploy.yml

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read production worker health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail-with-body --silent --show-error https://elyon-jarvis-worker.mailvahanam-raoul.workers.dev/health)"
          echo "HEALTH=${HEALTH}"
          printf '%s' "$HEALTH" | python -c '
          import json,sys
          data=json.load(sys.stdin)
          print("VERSION=" + str(data.get("version")))
          print("PRODUCT_ENRICHMENT=" + str(data.get("productEnrichment")))
          print("OPENROUTER_RESEARCH=" + str(data.get("openRouterResearch")))
          '

name: Deploy Jarvis Worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/jarvis-brain-files
    paths:
      - .github/cloudflare-worker-deploy.trigger

permissions:
  contents: read

concurrency:
  group: jarvis-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Jarvis Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install Worker dependencies
        working-directory: cloudflare/jarvis-worker
        run: npm install --no-audit --no-fund

      - name: Run Worker tests
        working-directory: cloudflare/jarvis-worker
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/jarvis-worker
          command: deploy

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://elyon-jarvis-worker.mailvahanam-raoul.workers.dev/health"
          runtime_url="https://elyon-jarvis-worker.mailvahanam-raoul.workers.dev/runtime/health"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$health_url" > /tmp/jarvis-health.json && \
               curl --fail --silent --show-error "$runtime_url" > /tmp/jarvis-runtime.json; then
              cat /tmp/jarvis-health.json
              echo
              cat /tmp/jarvis-runtime.json
              echo
              exit 0
            fi
            sleep 5
          done

          echo "Jarvis Worker healthcheck failed after deployment."
          exit 1

name: P0 safety tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run security tests
        shell: bash
        run: |
          status=0
          npm test > test-output.log 2>&1 || status=$?
          tail -n 180 test-output.log
          exit "$status"
      - name: Upload complete test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Verify production build
        run: npm run build

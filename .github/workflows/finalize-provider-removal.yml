name: Finalize retired provider removal

on:
  push:
    branches:
      - fix/remove-qwen-provider

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-qwen-provider
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove retired HTML options
        shell: python
        run: |
          from pathlib import Path

          retired = "".join(("qw", "en"))
          labels = [
              f'<option value="{retired}">{retired.title()}</option>',
              f'<option value="{retired}-plus">{retired.title()} Plus</option>',
              f'<option value="{retired}-flash">{retired.title()} Flash</option>',
              f'<option value="{retired}-max">{retired.title()} Max</option>',
          ]
          for filename in ("index.html", "public/index.html"):
              path = Path(filename)
              content = path.read_text(encoding="utf-8-sig")
              for label in labels:
                  content = content.replace(f"              {label}\n", "")
                  content = content.replace(f"              {label}\r\n", "")
                  content = content.replace(label, "")
              path.write_text(content, encoding="utf-8")
              assert retired not in content.lower(), f"retired provider remains in {filename}"

      - name: Remove one-time workflow before validation
        run: rm .github/workflows/finalize-provider-removal.yml

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run production build
        run: npm run prepare:web

      - name: Validate diff
        run: git diff --check

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ai): remove retired provider from HTML templates"
          git push origin HEAD:fix/remove-qwen-provider

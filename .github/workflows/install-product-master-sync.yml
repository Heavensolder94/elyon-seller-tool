name: Install Product Master UI Sync

on:
  push:
    branches:
      - feat/company-os-product-bridge
    paths:
      - .github/workflows/install-product-master-sync.yml

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'chore: install product master UI patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/company-os-product-bridge
          fetch-depth: 0

      - name: Load Product Master sync script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          content = path.read_text(encoding='utf-8-sig')
          marker = '<script defer src="elyon-soul.js"></script>'
          addition = '<script defer src="seller-product-master-sync.js"></script>\n' + marker
          if 'seller-product-master-sync.js' not in content:
              if marker not in content:
                  raise SystemExit('elyon-soul.js marker not found')
              content = content.replace(marker, addition, 1)
              path.write_text(content, encoding='utf-8-sig')
          PY

      - name: Commit UI loader
        run: |
          if git diff --quiet -- index.html; then
            echo "Product Master loader already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load server Product Master in seller UI"
          git push origin HEAD:feat/company-os-product-bridge

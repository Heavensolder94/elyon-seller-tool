<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Elyon Browser OS Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Settings</h1>
      <section class="card">
        <label><input type="checkbox" id="securityMode" /> securityMode</label>
        <label><input type="checkbox" id="sandboxMode" /> sandboxMode</label>
        <label><input type="checkbox" id="autonomyLocked" /> autonomyLocked</label>
        <label><input type="checkbox" id="pauseAllAgents" /> pauseAllAgents</label>
        <label><input type="checkbox" id="aiEnabled" /> aiEnabled</label>
      </section>
      <section class="card">
        <div class="label">Security Preview</div>
        <div id="securityPreview" class="value">-</div>
        <div id="securityDetail" class="hint">-</div>
      </section>
      <section class="card">
        <div class="label">Research Memory</div>
        <div class="hint">Lokale Produktliste mit Status, Notizen und Export.</div>
        <button id="openResearch" type="button">Research anzeigen</button>
      </section>
      <section class="card">
        <div class="label">API Connector</div>
        <input id="backendUrl" type="url" placeholder="Backend URL" />
        <div id="backendHint" class="hint">Noch nicht getestet.</div>
      </section>
      <section class="card">
        <div class="label">Soul Agent System</div>
        <div class="hint">Nur Vorschau / Sandbox. Keine Live-Aktion.</div>
        <button id="openAgents" type="button">Agenten anzeigen</button>
      </section>
      <button id="save" type="button">Speichern</button>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
